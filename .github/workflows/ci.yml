name: CI
on: [push, pull_request]
jobs:
  verify:
    # Pinned: the Playwright version in package.json cannot install Chromium on
    # Ubuntu 26.04, which is what ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ESLint 10 and Obsidian's lint plugin need Node 20.19 or newer
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The same rules Obsidian's community directory scans each release with
      - run: npm run lint
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:mobile
      - run: npm run build
