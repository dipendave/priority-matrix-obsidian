name: CI
on: [push, pull_request]
jobs:
  verify:
    # Pinned: the Playwright version in package.json cannot install Chromium on
    # Ubuntu 26.04, which is what ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:mobile
      - run: npm run build
